  if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];lastTouchDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);drag=null;}
  else start(e.touches[0].clientX,e.touches[0].clientY,false,e.target);
  e.preventDefault();},{passive:false,capture:true});
addEventListener("touchmove",e=>{if(inPanel(e.target))return;
  if(e.touches.length===2&&lastTouchDist){const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    dist=Math.max(0.15,Math.min(6,dist*lastTouchDist/d));lastTouchDist=d;req();}
  else if(e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY);
  e.preventDefault();},{passive:false,capture:true});
addEventListener("touchend",end,{capture:true});
addEventListener("wheel",e=>{if(inPanel(e.target))return;e.preventDefault();dist*=Math.exp(e.deltaY*0.0012);dist=Math.max(0.15,Math.min(6,dist));req();},{passive:false,capture:true});
addEventListener("contextmenu",e=>{if(!inPanel(e.target))e.preventDefault();},true);
rs();
