const pts=f32(D.pts), col=u8(D.col), trail=f32(D.trail), grid=f32(D.grid), frust=f32(D.frustum);
const cv=document.getElementById('c');

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];

  return[f/asp,0,0,0, 0,f,0,0, 0,0,(fr+n)*d,-1, 0,0,2*fr*n*d,0];}

const mvpNow=()=>mul(persp(1.0,cv.width/cv.height,0.02,80),look(eye(),target,UP));

const F=D.F;

let pending=false;

  cv.height=Math.round(cv.clientHeight*r);onResize();}

const sl=document.getElementById('slider'),lbl=document.getElementById('lbl'),gr=document.getElementById('grasp');
sl.max=F-1;
function setFrame(v){frame=Math.max(0,Math.min(F-1,v));sl.value=frame;
  lbl.textContent='frame '+String(D.idx[frame]).padStart(5,'0')+'  ('+(frame+1)+'/'+F+')  '+(D.off[frame+1]-D.off[frame])+' pts';
  const g=D.grasp[frame];
  gr.innerHTML=g<0?'grasp: (no hand)':(g>0.5?'grasp: <span style="color:#cf3730">CLOSED</span>':'grasp: open');
  requestRender();}
sl.addEventListener('input',()=>setFrame(+sl.value));
document.getElementById('prev').onclick=()=>setFrame(frame-1);
document.getElementById('next').onclick=()=>setFrame(frame+1);
const playBtn=document.getElementById('play');
let timer=null;
function togglePlay(){playing=!playing;playBtn.innerHTML=playing?'&#10074;&#10074;':'&#9654;';
  if(playing){timer=setInterval(()=>setFrame(frame+1>=F?0:frame+1),1000/D.fps);}else{clearInterval(timer);}}
playBtn.onclick=togglePlay;
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')setFrame(frame-1);
  else if(e.key==='ArrowRight')setFrame(frame+1);
  else if(e.key===' '){togglePlay();e.preventDefault();}});

const lg=document.getElementById('legend');
for(const [name,c] of D.legend){lg.innerHTML+='<div><span class="dot" style="background:rgb('+c.join(',')+')"></span>'+name+'</div>';}
